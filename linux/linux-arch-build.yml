name: Linux build and bundle

# Linux-enabled release workflow for BDadmehr0/AetherGUI.
#
# Kept here (outside `.github/workflows/`) because the fork-push credential
# available in this project cannot create or update files under
# `.github/workflows/*` (GitHub App `workflows` permission). To enable Linux
# release builds, copy this file into the workflows directory after merging:
#
#     cp linux/linux-arch-build.yml .github/workflows/linux-arch-build.yml
#
# Mirrors the `linux-build-and-bundle` job in linux/release.yml, with pinned
# action SHAs taken from the same file.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: linux-build-and-bundle-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux-build-and-bundle:
    name: Linux build and bundle
    runs-on: ubuntu-latest
    steps:
      # actions/checkout v4.4.0
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      # actions/setup-node v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "22"
          cache: npm
      # dtolnay/rust-toolchain, same pinned SHA as linux/release.yml.
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: stable
      - name: Install WebKitGTK and Tauri system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev unzip curl
      - name: Install dependencies
        run: npm ci
      - name: Fetch and verify Linux sidecars (x86_64)
        env:
          BUILD_TARGET: x86_64-unknown-linux-gnu
        run: npm run fetch:linux
      - name: Test frontend
        run: npm test
      - name: Test Rust backend
        run: cargo test --manifest-path src-tauri/Cargo.toml --locked
      - name: Build Linux bundles (deb, rpm, AppImage)
        env:
          BUILD_TARGET: x86_64-unknown-linux-gnu
        run: npm run build -- --config src-tauri/tauri.linux.conf.json
      - name: Stage Linux release files
        shell: bash
        run: |
          mkdir -p linux-release
          find src-tauri/target/release/bundle -maxdepth 3 -type f \( -name '*.deb' -o -name '*.rpm' -o -name '*.AppImage' \) -exec cp {} linux-release/ \;
          ls -la linux-release
          cd linux-release && sha256sum * > SHA256SUMS.txt
      # actions/upload-artifact v4.6.2
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: AetherGUI-Linux
          path: linux-release/*
          if-no-files-found: error
